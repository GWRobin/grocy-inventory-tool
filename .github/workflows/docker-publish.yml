name: Build & publish Docker image

on:
  push:
    branches: ["main"]
    # Triggar även vid ny release-tagg, t.ex. v1.0.0
    tags: ["v*.*.*"]
  # Bygg manuellt från Actions-fliken om du vill
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Fylls i automatiskt från ditt GitHub-användarnamn och repo-namn
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Tillåter push till ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Inbyggd, ingen extra hemlighet behövs

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest på varje push till main
            type=raw,value=latest,enable={{is_default_branch}}
            # semantisk versionstagg, t.ex. v1.2.3 → 1.2.3 + 1.2 + 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # kort commit-hash för spårbarhet, t.ex. sha-a1b2c3d
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cachar lager mellan byggen för snabbare CI
          cache-from: type=gha
          cache-to: type=gha,mode=max
