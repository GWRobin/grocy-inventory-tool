services:
  grocy-inventory:
    image: ghcr.io/DITT-GITHUB-ANVÄNDARNAMN/DITT-REPO:latest
    container_name: grocy-inventory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      # Alternativ 1: ange direkt här
      GROCY_URL: "https://grocy.ditt-hem.se"
      GROCY_KEY: "din-api-nyckel"
      # Alternativ 2: läs från en .env-fil (rekommenderas)
      # Skapa filen .env i samma mapp med:
      #   GROCY_URL=https://grocy.ditt-hem.se
      #   GROCY_KEY=din-api-nyckel
      # Och kommentera bort raderna ovan, lägg till:
      # env_file: .env
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grocy-inventory.rule=Host(`inventory.DINDOMAN.SE`)"
      - "traefik.http.routers.grocy-inventory.entrypoints=websecure"
      - "traefik.http.routers.grocy-inventory.tls=true"
      - "traefik.http.routers.grocy-inventory.middlewares=authelia@file"
      - "traefik.http.services.grocy-inventory.loadbalancer.server.url=http://127.0.0.1:8090"

networks:
  traefik:
    external: true
    name: traefik
