# Traefik v2 – dynamic file configuration för Grocy Inventering
#
# Placera den här filen i din Traefik dynamic config-mapp, t.ex.:
#   /etc/traefik/dynamic/grocy-inventory.yml
#
# Se till att din statiska Traefik-config har file-providern aktiverad, t.ex.:
#   providers:
#     file:
#       directory: /etc/traefik/dynamic
#       watch: true

http:
  # ── Middleware: Authelia ForwardAuth ──────────────────────────────────
  # Om du redan har en authelia-middleware definierad i en annan fil
  # kan du ta bort detta block och bara referera till den i routern nedan.
  middlewares:
    authelia:
      forwardAuth:
        # Byt ut URL:en mot din Authelia-instans
        address: "http://localhost:9091/api/verify?rd=https://auth.DINDOMAN.SE"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Name"
          - "Remote-Email"

  # ── Router ───────────────────────────────────────────────────────────
  routers:
    grocy-inventory:
      rule: "Host(`inventory.DINDOMAN.SE`)"
      entryPoints:
        - websecure
      middlewares:
        - authelia
      service: grocy-inventory
      tls: {}
      # Använd certresolver om du inte har ett wildcard-cert:
      # tls:
      #   certResolver: letsencrypt

  # ── Service ──────────────────────────────────────────────────────────
  services:
    grocy-inventory:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8090"
