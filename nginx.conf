server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy Grocy API calls to avoid CORS issues (optional – see docker-compose.yml)
    # Uncomment and set GROCY_UPSTREAM if you want the container to proxy API calls:
    #
    # location /api/ {
    #     proxy_pass http://grocy/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
